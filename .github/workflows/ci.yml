name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Carries RUST_TEST_THREADS, which the suite depends on to avoid ETXTBSY.
      - '.cargo/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # --all-targets so test code is linted too. Without it clippy sees only the
      # binary, and lints in #[cfg(test)] modules drift in unnoticed.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Two toolchains, one job definition, so the msrv leg cannot drift from what `stable`
    # actually runs -- it is the same build and the same suite, only the compiler differs.
    # `msrv` resolves to `rust-version` in Cargo.toml (see the step below); a dependency bump
    # that raises the real floor fails here, on the PR that raises it, instead of reaching a
    # user as a compile error deep in a transitive crate.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    # A real run finishes in a couple of minutes; this cap exists only so a hung test (e.g. a
    # pty-driven cucumber scenario whose child never gets EOF) fails fast with a clear GitHub
    # Actions timeout instead of silently eating the 360-minute default. The test harness has
    # its own inner timeout too (see `wait_with_output_timeout` in tests/cucumber.rs) — this is
    # the second line of defence, not the only one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The floor lives in exactly one place, Cargo.toml's `rust-version`. Reading it back
      # rather than repeating it here is what keeps the declared floor and the tested floor
      # the same number; a rename or removal fails the job instead of quietly falling back
      # to stable, which would test nothing and still look green.
      - name: Resolve toolchain
        id: toolchain
        run: |
          if [ "${{ matrix.toolchain }}" != "msrv" ]; then
            echo "version=${{ matrix.toolchain }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "could not read rust-version from Cargo.toml" >&2
            echo "(was the key renamed or removed? this job must not silently test stable)" >&2
            exit 1
          fi
          echo "declared floor: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Install jj
        run: |
          # Keep in step with .devcontainer/Dockerfile — the pin is only worth
          # having if CI and local dev test against the same jj.
          # renovate: datasource=github-releases depName=jj-vcs/jj
          JJ_VERSION=0.44.0
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/jj'
          jj --version

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # Only from the stable leg: both legs produce the same binary, and two uploads under one
      # artifact name is an error.
      - name: Upload binary artifact
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: am-x86_64-unknown-linux-gnu
          path: target/debug/am
          if-no-files-found: error

  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Linux is already build-checked by the `test` job. This job catches
    # macOS/Windows-specific compile breakage on PRs instead of only at release
    # time; the remaining targets are exercised by release.yml on v* tags.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: am-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/am${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
          if-no-files-found: error
