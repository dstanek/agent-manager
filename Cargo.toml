[package]
name = "am"
version = "0.5.0"
edition = "2021"
# The real floor, measured from the resolve graph, not a number picked once and left. Both the
# binary and the test suite need it: `ureq -> url -> idna -> idna_adapter -> icu_*` pins the
# build, `cucumber -> globwalk -> ignore/globset` pins the tests. Every constraint so far has
# been transitive, so this moves on dependency bumps nobody asked for it to move on -- the
# `msrv` leg of ci.yml's test matrix reads this value back, so a move shows up as a failing
# job on the bumping PR instead of as a user's compile error. See docs/reference/building.md.
rust-version = "1.88"
description = "Creates isolated environments for coding agents"
authors = ["David Stanek"]
license = "MIT"
repository = "https://github.com/dstanek/agent-manager"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.0"
toml_edit = "0.25"
anyhow = "1"
thiserror = "2"
which = "8"
chrono = { version = "0.4", features = ["serde"] }
serde_json_lenient = "0.2.4"
sha2 = "0.11.0"
fs2 = "0.4"
ureq = { version = "2", features = ["tls"] }
tar = "0.4.46"
base64 = "0.23"
flate2 = "1.1.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[lints.rust]
unused = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Test tiers. Every one of these is empty of code — they exist only to select tests that need
# something the ordinary suite does not, so that `cargo test` is always runnable anywhere and a
# developer can opt into exactly the infrastructure they have. See CLAUDE.md for what each needs
# and how to stand it up.
[features]
default = []
# The whole integration tier, for CI.
integration = [
    "integration-cli",
    "integration-registry",
    "integration-network",
    "integration-compose",
]
# @devcontainers/cli on PATH, a container runtime, and network access for real Feature and base
# image pulls. These are the differential tests: they compare am's output against the reference
# implementation's, which is the one thing a fixture cannot stand in for.
integration-cli = []
# The local registries from scripts/test-registry.sh, including one behind htpasswd that the
# runtime has logged in to.
integration-registry = []
# Public network access only — no daemon, no local services.
integration-network = []
# A working Compose provider (`docker compose`, or a standalone docker-compose).
integration-compose = []

[dev-dependencies]
tempfile = "3"
cucumber = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "cucumber"
harness = false

[package.metadata.deb]
section = "devel"
priority = "optional"
assets = [
    ["target/release/am", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/am", dest = "/usr/bin/am", mode = "755" },
]
