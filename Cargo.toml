[package]
name = "am"
version = "0.5.0"
edition = "2021"
description = "Creates isolated environments for coding agents"
authors = ["David Stanek"]
license = "MIT"
repository = "https://github.com/dstanek/agent-manager"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.0"
toml_edit = "0.25"
anyhow = "1"
thiserror = "2"
which = "8"
chrono = { version = "0.4", features = ["serde"] }
serde_json_lenient = "0.2.4"
sha2 = "0.11.0"
fs2 = "0.4"
ureq = { version = "2", features = ["tls"] }
tar = "0.4.46"
flate2 = "1.1.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[lints.rust]
unused = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"
cucumber = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "cucumber"
harness = false

[package.metadata.deb]
section = "devel"
priority = "optional"
assets = [
    ["target/release/am", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/am", dest = "/usr/bin/am", mode = "755" },
]
